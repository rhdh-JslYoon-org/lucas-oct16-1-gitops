# Route for Streamlit UI Application (OpenShift)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/instance: lucas-oct16-1
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: lucas-oct16-1
  name: lucas-oct16-1
spec:
  port:
    targetPort: 8501
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: lucas-oct16-1
    weight: 100
  wildcardPolicy: None

